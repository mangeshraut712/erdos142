[project]
name = "erdos142"
version = "0.0.0"
description = "Research notes and finite verifiers for an open attempt on Erdős problem 142"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Mangesh Raut", email = "mbr63@drexel.edu" },
]
keywords = [
  "erdos",
  "additive-combinatorics",
  "research",
]
dependencies = []

[project.optional-dependencies]
verification = ["numpy>=1.24,<3"]
exploration = ["numpy>=1.24,<3", "scipy>=1.10,<2"]
test = ["numpy>=1.24,<3", "pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/mangeshraut712/erdos142"
Repository = "https://github.com/mangeshraut712/erdos142"
Issues = "https://github.com/mangeshraut712/erdos142/issues"
Sponsor = "https://github.com/sponsors/mangeshraut712"

[tool.setuptools]
py-modules = []

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
